<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Govee Settings</title>
  <style>
    :root { color-scheme: dark light; font-family: Inter, Segoe UI, sans-serif; }
    body { margin: 0; background: transparent; color: inherit; }
    form { display: grid; gap: 10px; padding: 12px; }
    p { margin: 0; font-size: 12px; opacity: .78; }
    label { display: grid; gap: 4px; font-size: 12px; opacity: .88; }
    .field { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; border: 1px solid color-mix(in srgb, currentColor 24%, transparent); border-radius: 6px; background: color-mix(in srgb, currentColor 8%, transparent); color: inherit; padding: 7px 9px; font: inherit; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid #0891b2; border-radius: 6px; background: #0891b2; color: white; padding: 7px 10px; font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 30%, transparent); }
    a { color: #38bdf8; }
    .message { min-height: 18px; font-size: 12px; opacity: .78; }
  </style>
</head>
<body>
  <form id="form" autocomplete="off">
    <p>Enter your Govee Open API key to enable smart lighting and device automation.</p>
    <label for="apiKey">API Key</label>
    <div class="field">
      <input id="apiKey" name="apiKey" type="password" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      <button id="toggle" class="secondary" type="button">Show</button>
    </div>
    <p>Generate API keys from the <a href="https://developer.govee.com/reference/getting-started" target="_blank" rel="noopener noreferrer">Govee Developer Console</a>.</p>
    <div class="actions">
      <button type="submit">Save</button>
      <button id="clear" class="secondary" type="button">Clear key</button>
    </div>
    <div id="message" class="message"></div>
  </form>
  <script>
    const moduleId = 'govee';
    const assetPath = 'settings/settings.html';
    const configUrl = `/modules/${moduleId}/config`;
    const REDACTED = '[redacted]';
    const form = document.getElementById('form');
    const input = document.getElementById('apiKey');
    const message = document.getElementById('message');
    let storedKey = false;

    function reportFrameHeight() {
      const contentHeight = form.getBoundingClientRect().height || document.body.scrollHeight;
      window.parent?.postMessage({ type: 'nyautomator:module-frame-height', moduleId, assetPath, height: contentHeight + 8 }, window.location.origin);
    }

    function setMessage(text) {
      message.textContent = text || '';
      reportFrameHeight();
    }

    async function load() {
      const response = await fetch(configUrl, { cache: 'no-store' });
      const config = await response.json().catch(() => ({}));
      storedKey = !!config.apiKey;
      input.value = '';
      input.placeholder = storedKey ? 'Saved (hidden). Enter a new key to replace it.' : 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx';
      reportFrameHeight();
    }

    async function save(apiKey) {
      const response = await fetch(configUrl, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ apiKey })
      });
      const body = await response.json().catch(() => null);
      if (!response.ok)
        throw new Error(body?.error || 'Save failed.');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const typed = input.value.trim();
      try {
        await save(typed || (storedKey ? REDACTED : ''));
        await load();
        setMessage('Saved.');
      } catch (err) {
        setMessage(err.message);
      }
    });

    document.getElementById('clear').addEventListener('click', async () => {
      try {
        await save('');
        await load();
        setMessage('Cleared Govee API key.');
      } catch (err) {
        setMessage(err.message);
      }
    });

    document.getElementById('toggle').addEventListener('click', event => {
      const hidden = input.type === 'password';
      input.type = hidden ? 'text' : 'password';
      event.currentTarget.textContent = hidden ? 'Hide' : 'Show';
    });

    window.addEventListener('message', async event => {
      if (event.origin !== window.location.origin || event.data?.type !== 'nyautomator:module-settings-save')
        return;
      const requestId = event.data.requestId;
      let ok = true;
      let error = null;
      const typed = input.value.trim();
      if (typed) {
        try {
          await save(typed);
          await load();
          setMessage('Saved.');
        } catch (err) {
          ok = false;
          error = err.message;
          setMessage(err.message);
        }
      }
      event.source?.postMessage({ type: 'nyautomator:module-settings-save-result', requestId, moduleId, ok, error }, window.location.origin);
    });

    load().catch(err => setMessage(err.message));
    window.addEventListener('load', reportFrameHeight);
    if ('ResizeObserver' in window)
      new ResizeObserver(reportFrameHeight).observe(form);
  </script>
</body>
</html>
